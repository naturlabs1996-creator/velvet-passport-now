name: Paris 05 - Kokoro bilingual audio (manual)

# Manual only. GitHub Actions runner minutes/storage may be billable
# depending on repository visibility and account quotas.
on:
  workflow_dispatch:

jobs:
  render-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Kokoro and audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kokoro soundfile numpy
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Generate 8 WAV narrations
        run: |
          python scripts/audio/render_kokoro.py \
            docs/pilots/paris-05-audio-input.json \
            generated-audio/paris-05
      - name: Check all eight files
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          files = sorted(Path('generated-audio/paris-05').glob('*.wav'))
          assert len(files) == 8, f'Expected 8 WAV files, got {len(files)}'
          for f in files:
              info = sf.info(str(f))
              assert info.frames > 24000 and info.samplerate == 24000, (f, info)
              print(f'{f.name}: {info.duration:.1f}s')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paris-05-kokoro-wav-fr-en
          path: generated-audio/paris-05/*.wav
          retention-days: 7
