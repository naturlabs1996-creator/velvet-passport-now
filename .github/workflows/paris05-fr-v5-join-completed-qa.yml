name: Paris 05 FR V5 — join completed eleven WAVs (QA only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-fr-v5-join-completed-qa.yml'
      - 'scripts/audio/assemble_paris05_fr_v5_from_artifacts.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  join_existing_audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve eleven already completed WAV artifacts (no generation)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(INTRO STOP-01 TRANSITION-01-SEBAI STOP-SEBAI-1977 TRANSITION-01-02 STOP-02 TRANSITION-02-03 STOP-03 TRANSITION-03-04 STOP-04 OUTRO)
          for id in "${ids[@]}"; do
            mkdir -p "downloaded/$id"
            gh run download 41238865083 --repo "$GITHUB_REPOSITORY" --name "paris05-fr-v5-native-$id" --dir "downloaded/$id"
            test -s "downloaded/$id/$id-FR-NATIVE-100.wav"
          done
      - name: Install lightweight float32 WAV reader
        run: python -m pip install soundfile==0.13.1
      - name: Join audio losslessly in script and verify eleven distinct segments
        run: |
          python scripts/audio/assemble_paris05_fr_v5_from_artifacts.py --input-root downloaded --output-dir assembled-v5-qa
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("assembled-v5-qa/PARIS05-FR-V5-11SEG-QA.json").read_text())
          assert len(q["chapters"]) == 11
          assert q["chapters"][-2]["id"] == "STOP-04"
          assert q["duration_seconds"] > 2500
          print("QA audio master:", q["master_wav"], q["duration_seconds"], "seconds", flush=True)
          PY
      - name: Upload master and per-chapter timing QA
        uses: actions/upload-artifact@v4
        with:
          name: PARIS05-FR-V5-11SEG-COMPLETE-AUDIO-QA
          path: |
            assembled-v5-qa/PARIS05-FR-V5-11SEG-QA.wav
            assembled-v5-qa/PARIS05-FR-V5-11SEG-QA.json
          retention-days: 14
