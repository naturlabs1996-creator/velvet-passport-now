name: Velvet Production Engine V1 QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production/build_route.py'
      - 'scripts/production/draft_subtitles.py'
      - 'tests/production_engine_smoke.py'
      - '.github/workflows/velvet-production-engine-v1.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg\n        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg\n      - name: Install test dependency
        run: python -m pip install Pillow
      - name: Verify bilingual MP4 assembly and rights blocking
        run: python tests/production_engine_smoke.py
