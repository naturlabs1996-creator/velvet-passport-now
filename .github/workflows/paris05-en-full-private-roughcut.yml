name: Paris05 EN — full private documentary roughcut
on:
  push:
    branches: [main]
    paths:
      - 'scripts/production/render_paris05_en_full_private.py'
      - '.github/workflows/paris05-en-full-private-roughcut.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  roughcut:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39892403459
          name: paris05-fr-image-edl-review
          path: dist/paris05-image-alignment
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39783346444
          name: paris05-en-full-11seg-audio-qa-p232
          path: downloaded/master
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39881034897
          name: paris05-authentic-visuals-provenance-REVIEW-ONLY
          path: downloaded/archival-main
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39881285190
          name: paris05-targeted-authentic-visuals-REVIEW-ONLY
          path: downloaded/archival-targeted
      - name: Install renderer
        run: python -m pip install Pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Assemble complete private English documentary preview
        run: python scripts/production/render_paris05_en_full_private.py
      - name: Upload full video and verification
        uses: actions/upload-artifact@v4
        with:
          name: PARIS05-EN-FULL-PRIVATE-DOCUMENTARY-REVIEW
          path: |
            dist/paris05-en-full-review/PARIS05-EN-FULL-PRIVATE-REVIEW.mp4
            dist/paris05-en-full-review/review-qa.json
          retention-days: 14
