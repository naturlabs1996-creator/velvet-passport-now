name: Paris05 FINAL intro Louis-le-Grand listening check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-intro-last-check.yml'
  workflow_dispatch:
jobs:
  final-line:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned narrator TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2" soundfile
      - name: Retrieve original approved narrator reference
        run: |
          mkdir -p references
          curl -fL --retry 3 -o references/developer-1.mp3 "https://huggingface.co/kyutai/tts-voices/resolve/main/unmute-prod-website/developer-1.mp3?download=true"
      - name: Create final introduction pronunciation check
        run: python scripts/audio/paris05_intro_last_check.py docs/pilots/paris05-fr-intro-last-pronunciation.json output references/developer-1.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: paris05-fr-intro-Louis-le-Grand-LAST-CHECK
          path: output/*
          retention-days: 14
