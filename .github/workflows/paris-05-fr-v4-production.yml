name: Paris 05 - FR V4 production locked
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris-05-fr-v4-production.yml'
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        segment: [INTRO, STOP-01, TRANSITION-01-SEBAI, STOP-SEBAI-1977, TRANSITION-01-02, STOP-02, TRANSITION-02-03, STOP-03, TRANSITION-03-04, STOP-04, OUTRO]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Chatterbox V3 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2" soundfile librosa
      - name: Render locked French narration (stage cues excluded)
        run: |
          python scripts/audio/render_chatterbox_v3_segment_fr.py \
            docs/pilots/paris-05-fr-v4-tts-and-cues.json \
            generated-audio/${{ matrix.segment }} \
            --segment-id "${{ matrix.segment }}" \
            --exaggeration 0.72 --cfg-weight 0.30 --temperature 0.80 --pause-ms 420 --tempo 0.96
      - uses: actions/upload-artifact@v4
        with:
          name: paris-05-v4-fr-${{ matrix.segment }}
          path: generated-audio/${{ matrix.segment }}/*
          retention-days: 14
  assemble-qa:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: paris-05-v4-fr-*
          path: collected
          merge-multiple: true
      - name: Assemble 11 ordered segments and measure durations
        run: |
          python -m pip install numpy soundfile
          python - <<'PY'
          from pathlib import Path
          import json,numpy as np,soundfile as sf
          order=["INTRO","STOP-01","TRANSITION-01-SEBAI","STOP-SEBAI-1977","TRANSITION-01-02","STOP-02","TRANSITION-02-03","STOP-03","TRANSITION-03-04","STOP-04","OUTRO"]
          root=Path("collected"); out=Path("assembled"); out.mkdir(exist_ok=True)
          pieces=[]; report=[]; sr=None
          for i,sid in enumerate(order):
              meta=json.loads((root/f"{sid}.json").read_text(encoding="utf-8"))
              audio,this_sr=sf.read(root/meta["file"],dtype="float32")
              if audio.ndim>1: audio=np.mean(audio,axis=1)
              if sr is None: sr=this_sr
              assert this_sr==sr, f"sample-rate mismatch {sid}"
              meta["duration_seconds"]=float(len(audio)/sr)
              pieces.append(audio)
              report.append(meta)
              if i<len(order)-1: pieces.append(np.zeros(int(sr*1.2),dtype=np.float32))
          full=np.concatenate(pieces)
          filename=out/"VP-PAR-NOW-05-fr-chatterbox-v4-editorial-lock.wav"
          sf.write(filename,full,sr)
          result={"route_id":"VP-PAR-NOW-05","version":"fr-v4-audio","sample_rate":sr,"total_duration_seconds":float(len(full)/sr),"segments":report}
          (out/"VP-PAR-NOW-05-fr-v4-qa.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print("TOTAL_MINUTES",round(len(full)/sr/60,2))
          PY
      - name: Require five actual WAV minutes per stop
        run: python scripts/audio/qa_stop_minimum_runtime.py assembled/VP-PAR-NOW-05-fr-v4-qa.json --minimum-seconds 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paris-05-v4-fr-master-and-qa
          path: assembled/*
          retention-days: 14
