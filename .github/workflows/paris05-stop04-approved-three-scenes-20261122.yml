name: Paris 05 STOP 04 - approved S07 S16 S19 Chatterbox V3 takes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-stop04-approved-three-scenes-20261122.yml'
permissions:
  contents: read
concurrency:
  group: stop04-approved-three-scene-native100
  cancel-in-progress: false
jobs:
  render-native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scene: [S07, S16, S19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Chatterbox V3
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2" soundfile
      - name: Fetch the previously used French narrator reference
        run: |
          mkdir -p references
          curl -fL --retry 3 --connect-timeout 20 -o references/developer-1.mp3 "https://huggingface.co/kyutai/tts-voices/resolve/main/unmute-prod-website/developer-1.mp3?download=true"
      - name: Generate full native-tempo take and acoustic metadata
        run: |
          python scripts/audio/render_stop04_chatterbox_native100.py \
            --manifest docs/pilots/stop04-approved-three-scenes-20261122.json \
            --scene "${{ matrix.scene }}" \
            --reference references/developer-1.mp3 \
            --output output
      - name: Retain original WAV and QA metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop04-approved-native100-${{ matrix.scene }}-20261122
          path: output/*
          if-no-files-found: warn
          retention-days: 21
