name: Paris 05 - audio subtitle alignment
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Whisper model (small or medium)"
        required: true
        default: small
        type: choice
        options: [small, medium]
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python and ffmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --disable-pip-version-check 'faster-whisper==1.1.1'
      - name: Install Google Drive private client
        run: python -m pip install --disable-pip-version-check 'google-auth==2.38.0' 'requests==2.32.3'
      - name: Fetch private narration from Google Drive
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FILE_ID: 1wlDHR96DnQpnJszyv0VSMLsJa2NwopgI
        run: |
          python - <<'PY'
          import os, json
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          encoded=os.environ.get('DRIVE_SERVICE_ACCOUNT_JSON','')
          if not encoded: raise SystemExit('Missing GitHub secret DRIVE_SERVICE_ACCOUNT_JSON')
          details=json.loads(encoded)
          if details.get('type')!='service_account': raise SystemExit('A Google service account JSON key is required')
          creds=service_account.Credentials.from_service_account_info(details,scopes=['https://www.googleapis.com/auth/drive.readonly'])
          session=AuthorizedSession(creds)
          url='https://www.googleapis.com/drive/v3/files/'+os.environ['DRIVE_FILE_ID']
          with session.get(url,params={'alt':'media'},stream=True,timeout=180) as response:
              response.raise_for_status()
              with open('narration_download','wb') as output:
                  for part in response.iter_content(1024*1024):
                      if part: output.write(part)
          if os.path.getsize('narration_download') < 10000000:
              raise SystemExit('Downloaded recording too small')
          print('Private recording downloaded; size:',os.path.getsize('narration_download'))
          PY
      - name: Decode source to PCM WAV and verify duration
        run: |
          ffmpeg -v error -y -i narration_download -ar 16000 -ac 1 -c:a pcm_s16le narration.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 narration.wav
          python - <<'PY'
          import wave
          with wave.open('narration.wav','rb') as w:
              dur=w.getnframes()/w.getframerate()
          if not 3600 < dur < 3800: raise SystemExit(f'Unexpected master duration: {dur}')
          PY
      - name: Produce word timestamp candidates
        run: |
          python tools/paris05_align_audio.py --audio narration.wav --script docs/pilots/paris-05-fr-v4-tts-and-cues.json --model "${{ inputs.model }}" --output alignment
      - name: Preserve QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PARIS05_FR_ALIGNMENT_CANDIDATES
          path: alignment/
          if-no-files-found: warn
          retention-days: 14
