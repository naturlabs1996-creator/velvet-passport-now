name: Paris 05 - FR V4 engineering audio QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris-05-fr-v4-engineering-qa.yml'
jobs:
  signal-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve generated audio without rerendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p collected
          for sid in INTRO STOP-01 TRANSITION-01-SEBAI STOP-SEBAI-1977 TRANSITION-01-02 STOP-02 TRANSITION-02-03 STOP-03 TRANSITION-03-04 STOP-04 OUTRO; do
            gh run download 39194264293 --repo "${{ github.repository }}" --name "paris-05-v4-fr-${sid}" --dir collected
          done
      - name: Check WAV duration, headroom and anomalous silence
        run: |
          python -m pip install numpy soundfile
          python scripts/audio/qa_paris05_signal.py collected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paris-05-v4-fr-engineering-qa
          path: engineering-qa/*.json
          retention-days: 30
