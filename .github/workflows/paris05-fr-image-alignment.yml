name: Paris05 FR — align authentic images to measured narration
on:
  push:
    branches: [main]
    paths:
      - 'scripts/production/build_paris05_fr_image_edl.py'
      - 'scripts/production/render_paris05_fr_private_contact_reel.py'
      - '.github/workflows/paris05-fr-image-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  image-edl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39889321388
          github-token: ${{ github.token }}
          name: paris05-fr-measured-cue-alignment-review
          path: downloaded/alignment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Map verified source assets to measured narration cues
        run: python scripts/production/build_paris05_fr_image_edl.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 39629212549
          github-token: ${{ github.token }}
          name: paris05-fr-final-11seg-audio-and-qa
          path: downloaded/master
      - name: Install private QA renderer
        run: |
          python -m pip install Pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Render 11-chapter audio contact reel with placeholder slates
        run: python scripts/production/render_paris05_fr_private_contact_reel.py
      - name: Upload private audiovisual contact reel
        uses: actions/upload-artifact@v4
        with:
          name: paris05-fr-private-audiovisual-qa-preview
          path: |
            dist/paris05-image-alignment/paris05-fr-private-contact-reel.mp4
            dist/paris05-image-alignment/private-contact-reel-qa.json
          retention-days: 7
      - name: Upload editorial image alignment and holds
        uses: actions/upload-artifact@v4
        with:
          name: paris05-fr-image-edl-review
          path: dist/paris05-image-alignment/*.json
          retention-days: 30
