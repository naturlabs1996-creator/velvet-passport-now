name: Velvet Film Factory reproducible CI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/production/velvet_film_factory.py'
      - 'scripts/production/test_velvet_factory_smoke.py'
      - '.github/workflows/velvet-film-factory-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and verify FFmpeg/FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Reconstruct private synthetic film, validate Kdenlive XML, and confirm release fail-closed
        run: python3 scripts/production/test_velvet_factory_smoke.py
