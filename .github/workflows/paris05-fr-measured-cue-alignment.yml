name: Paris05 FR — measured narration visual-cue alignment
on:
  push:
    branches: [main]
    paths:
      - 'scripts/production/align_paris05_fr_cues.py'
      - '.github/workflows/paris05-fr-measured-cue-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measured-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39629212549
          github-token: ${{ github.token }}
          name: paris05-fr-final-11seg-audio-and-qa
          path: dist/paris05-staging/audio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install faster-whisper==1.2.1 soundfile==0.13.1 numpy==2.2.6
      - name: Run audio-based word alignment without changing masters
        run: python scripts/production/align_paris05_fr_cues.py
      - name: Upload measured cue report
        uses: actions/upload-artifact@v4
        with:
          name: paris05-fr-measured-cue-alignment-review
          path: dist/paris05-sync/*.json
          retention-days: 30
