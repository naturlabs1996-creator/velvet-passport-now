name: Paris 05 V5 FR — measure exact seven intro image cues
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-intro-seven-image-cues-measured.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact approved source voice and V5 intro (no new TTS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41238865083 --repo "$GITHUB_REPOSITORY" -n paris05-fr-v5-native-INTRO -D intro-source
          gh run download 39597674565 --repo "$GITHUB_REPOSITORY" -n paris05-fr-intro-Louis-le-Grand-LAST-CHECK -D intro-approved
      - name: Measure voice-anchored image cue timings
        run: |
          python -m pip install soundfile==0.13.1 numpy==2.2.6
          python scripts/production/paris05_intro7_v5_exact_cues.py
      - uses: actions/upload-artifact@v4
        with:
          name: PARIS05-INTRO-V5-FR-7-IMAGES-EXACT-CUES-QA
          path: intro7-measured/*
          retention-days: 14
