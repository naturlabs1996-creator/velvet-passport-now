name: Velvet Passport CC0 English male-candidate audition batch 01
on:
  push:
    branches: [main]
    paths: ['.github/workflows/velvet-cc0-en-male-candidates-batch01.yml']
  workflow_dispatch:
jobs:
  audition:
    strategy:
      fail-fast: false
      matrix:
        slot: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Chatterbox V3
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2" soundfile
      - name: Discover actual donated voice files and download
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          mkdir -p output
          python - <<'PY'
          import os,json,urllib.request
          from pathlib import Path
          url="https://huggingface.co/api/models/kyutai/tts-voices/tree/main/voice-donations?recursive=true&limit=1000"
          req=urllib.request.Request(url,headers={"User-Agent":"VelvetPassport-VoiceAudit/1.0"})
          with urllib.request.urlopen(req,timeout=45) as response:
              items=json.load(response)
          files=sorted(x['path'] for x in items if x.get('type')=='file' and x['path'].endswith('_enhanced.wav'))
          excluded={'0a67','1dd0','245e','30c5','4189','468c','4b13','4b70','5b55','1410','2181','29da','3973'}
          candidates=[p for p in files if p.split('/')[-1].split('_')[0] not in excluded]
          slot=int(os.environ['SLOT'])
          if len(candidates)<6:
              raise RuntimeError(f'Need 6 valid references; found {len(candidates)}. Available sample: {files[:10]}')
          p=candidates[slot]; sid=p.rsplit('/',1)[-1].split('_')[0]
          media="https://huggingface.co/kyutai/tts-voices/resolve/main/"+p+"?download=true"
          urllib.request.urlretrieve(media,"output/reference.wav")
          Path("output/reference-meta.json").write_text(json.dumps({"slot":slot,"speaker":sid,"source_file":p,"gender":"NOT VERIFIED","native_language":"NOT VERIFIED"},indent=2))
          print('SOURCE_FILE',p,'SPEAKER',sid)
          PY
      - name: Synthesize English test at native tempo 1.00
        env:
          SID: ${{ matrix.speaker }}
        run: |
          python - <<'PY'
          import os,json,torchaudio
          from pathlib import Path
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          sid=json.loads(Path('output/reference-meta.json').read_text())['speaker']
          text="Behind the grand facades of Paris, every street holds a secret. Listen closely, and the past begins to speak."
          m=ChatterboxMultilingualTTS.from_pretrained(device='cpu',t3_model='v3')
          y=m.generate(text,language_id='en',audio_prompt_path='output/reference.wav',exaggeration=0.72,cfg_weight=0.30,temperature=0.80).squeeze(0).cpu()
          torchaudio.save(f'output/VP-CC0-EN-{sid}-NATIVE-100.wav',y.unsqueeze(0),m.sr)
          Path('output/QA.json').write_text(json.dumps({'reference':sid,'native_language':'unverified','gender':'unverified','target_role':'English male candidate','tempo':1.0,'digital_time_stretch':False,'commercial_rights':'CC0 donation subject to consent/terms review','artistic_status':'PENDING'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velvet-cc0-en-${{ matrix.speaker }}-male-candidates-batch01
          path: output/*
          retention-days: 14
