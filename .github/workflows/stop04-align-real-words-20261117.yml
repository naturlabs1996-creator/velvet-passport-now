name: STOP04 - real Chatterbox word timestamps for source-first image cuts
on:
  workflow_dispatch:
  push:
    branches:
      - work/stop04-source-timeline-alignment-20261117
    paths:
      - .github/workflows/stop04-align-real-words-20261117.yml
      - scripts/production/stop04_align_voice_to_images.py
permissions:
  contents: read
  actions: read
jobs:
  align-words:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local CPU transcriber
        run: python -m pip install faster-whisper==1.2.1
      - name: Download ONLY existing WAV artifacts, not any rendered montage MP4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p voice_inputs/{S05,S06,S07,S23}
          gh run download 44078480402 -n stop04-missing-voice-S05-native100-20261117 -D voice_inputs/S05
          gh run download 44078480402 -n stop04-missing-voice-S06-native100-20261117 -D voice_inputs/S06
          gh run download 43068647100 -n stop04-native100-S07-20261111 -D voice_inputs/S07
          gh run download 43068647100 -n stop04-native100-S23-20261111 -D voice_inputs/S23
          find voice_inputs -type f -printf '%p %s bytes\n'
      - name: Align real words to photo changes
        run: python scripts/production/stop04_align_voice_to_images.py
      - name: Keep editable timestamp data and exact transcript for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop04-word-timing-4-scene-multi-photo-20261117
          path: aligned_output/*
          if-no-files-found: warn
          retention-days: 21
