name: Paris05 bilingual subtitle preparation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-bilingual-subtitles.yml'
      - 'scripts/production/paris05_generate_subtitles.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  subtitles:
    strategy:
      fail-fast: false
      matrix:
        lang: [fr, en]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39954802793
          name: PARIS05-${{ matrix.lang }}-SEBAI-INTEGRATED-REVIEW-AUDIO
          path: downloaded/master
      - name: Install speech recognition
        run: python -m pip install faster-whisper==1.2.1
      - name: Transcribe locked language-specific audio to review captions
        run: python scripts/production/paris05_generate_subtitles.py ${{ matrix.lang }}
      - uses: actions/upload-artifact@v4
        with:
          name: PARIS05-${{ matrix.lang }}-SUBTITLES-SRT-VTT-REVIEW
          path: dist/paris05-subtitles/
          retention-days: 30
