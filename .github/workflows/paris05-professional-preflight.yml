name: Paris05 PROFESSIONAL demo preflight - fail closed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-professional-preflight.yml'
      - 'scripts/production/paris05_professional_preflight.py'
      - 'scripts/production/paris05_image_exclusion.py'
      - 'docs/production/paris05-sebai-excluded-misattributed-images-2026-10-24.json'
      - 'docs/production/paris05-sebai-curiel-ghraieb-photo-prospects.json'
      - 'docs/production/paris05-visual-coverage-and-gaps.json'
      - 'docs/production/paris05-professional-storyboard-first-sequences.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate every exact photo, spoken phrase, source approval and timing
        run: python scripts/production/paris05_professional_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PARIS05-PROFESSIONAL-DEMO-RENDER-BLOCKERS
          path: dist/paris05-professional-preflight.json
          retention-days: 30
