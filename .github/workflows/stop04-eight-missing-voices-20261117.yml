name: STOP04 - eight missing French Chatterbox V3 voices at native 1.00
on:
  workflow_dispatch:
  push:
    branches:
      - work/stop04-eight-missing-voices-20261117
    paths:
      - .github/workflows/stop04-eight-missing-voices-20261117.yml
      - docs/pilots/stop04-8-voix-edl-native100-20261117.json
permissions:
  contents: read
concurrency:
  group: stop04-eight-missing-voices-20261117
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scene: [S05, S06, S08, S09, S10, S11, S17, S22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same pinned French Chatterbox V3 used for previous eight takes
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2" soundfile
      - name: Acquire the unchanged approved narrator reference
        run: |
          mkdir -p references
          curl -fL --retry 3 --connect-timeout 20 -o references/developer-1.mp3 "https://huggingface.co/kyutai/tts-voices/resolve/main/unmute-prod-website/developer-1.mp3?download=true"
          test $(wc -c < references/developer-1.mp3) -gt 10000
      - name: Render exact EDL scene text with native tempo and no timestretch
        run: |
          python scripts/audio/render_stop04_chatterbox_native100.py \
            --manifest docs/pilots/stop04-8-voix-edl-native100-20261117.json \
            --scene "${{ matrix.scene }}" \
            --reference references/developer-1.mp3 \
            --output output
      - name: Preserve exact WAV and measured duration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop04-missing-voice-${{ matrix.scene }}-native100-20261117
          path: output/*
          if-no-files-found: warn
          retention-days: 21
