name: Paris05 pronunciation splice preview with alignment QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-pronunciation-splice.yml'
  workflow_dispatch:
jobs:
  splice:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original 11 clean narrator WAVs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39488651589 -n paris05-fr-v4-clean-master-and-11-segments -D clean
          find clean -maxdepth 1 -name '*-FR-CLEAN-100.wav' | wc -l
      - name: Fetch approved five candidate WAVs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39531710824 -n paris05-fr-pronunciation-five-candidates -D auditions
          find auditions -maxdepth 1 -name '*.wav' | wc -l
      - name: Install alignment and WAV utilities
        run: python -m pip install faster-whisper==1.2.1 scipy==1.15.3 numpy==2.2.6
      - name: Align spoken text and build isolated review WAVs
        run: python scripts/audio/paris05_pronunciation_splice.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: paris05-fr-pronunciation-splice-REVIEW-only
          path: corrected/*
          retention-days: 14
