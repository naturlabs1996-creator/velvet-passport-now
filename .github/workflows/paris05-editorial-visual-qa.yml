name: Paris05 editorial QA - reject defective visual cuts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paris05-editorial-visual-qa.yml'
      - 'scripts/production/paris05_editorial_quality_gate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  editorial-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [fr,en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40025579787
          name: PARIS05-${{ matrix.language }}-CURATED-HISTORICAL-PRIVATE-MASTER
          path: incoming
      - name: Confirm editorial blocking defects
        run: python scripts/production/paris05_editorial_quality_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PARIS05-${{ matrix.language }}-REJECTED-EDITORIAL-AUDIT
          path: editorial-qa-result.json
          retention-days: 30
