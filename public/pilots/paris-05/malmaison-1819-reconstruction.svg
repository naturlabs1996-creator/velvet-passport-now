<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">Restitution typographique — vente de Malmaison, 1819</title><desc id="desc">Création contemporaine inspirée d'un catalogue de vente de 1819, et non reproduction du document original.</desc><rect width="900" height="1200" fill="#f5efdc"/><rect x="46" y="48" width="808" height="1104" fill="none" stroke="#625744" stroke-width="1"/><g fill="#24201b" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle"><text x="450" y="205" font-size="25" letter-spacing="5">VENTE PUBLIQUE</text><path d="M290 236 H610" stroke="#24201b"/><text x="450" y="333" font-size="49" font-weight="bold">MALMAISON</text><text x="450" y="411" font-size="24">Objets provenant des collections</text><text x="450" y="448" font-size="24">associées à Joséphine</text><text x="450" y="551" font-size="26" font-style="italic">Arts · Antiquités · Curiosités</text><text x="450" y="598" font-size="26" font-style="italic">Histoire naturelle · Mobilier</text><path d="M260 666 H640" stroke="#24201b"/><text x="450" y="745" font-size="29">24 mars 1819</text><text x="450" y="798" font-size="25">16, rue Louis-le-Grand, Paris</text><text x="450" y="854" font-size="24">Maître Lacoste</text><path d="M290 921 H610" stroke="#24201b"/><text x="450" y="1020" font-size="18">RESTITUTION TYPOGRAPHIQUE CONTEMPORAINE</text><text x="450" y="1052" font-size="17">Document original non reproduit · Imprimeur non identifié</text></g></svg>